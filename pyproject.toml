[project]
name = "bug-video-skill"
# Unused: the repository is not built as a package; apm.yml owns the plugin version.
version = "0.0.0"
description = "Agent Skill that turns Maestro runs into bug and before/after videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
src = ["tests"]
# The skill ships its Python entry point without a .py extension, so it runs by name.
extend-include = ["skills/*/scripts/record-maestro-run"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
