name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_ENV: ci

# One live run per ref — a new push supersedes the queued/running one
# instead of piling up when runners are saturated or offline.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    # GitHub-hosted, so pull requests from forks never run on self-hosted machines.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      # LW-11 (2026-11-26): no mise cache on self-hosted X64 VMs (restore ~24s vs cold install 9–11s);
      # save only from the default branch.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: ${{ !(runner.environment == 'self-hosted' && runner.os == 'Linux' && runner.arch == 'X64') }}
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
                github.event_name != 'pull_request_target' }}
          version: 2026.7.7
          install: true
          github_token: ${{ github.token }}
      - run: mise run test:default
