pre-commit:
  parallel: true
  commands:
    ruff-check:
      # The skill's recorder has no .py extension, so it runs by name.
      glob: &python_files ["**/*.py", "skills/*/scripts/record-maestro-run"]
      run: uv run ruff check {staged_files}
      fail_text: "ruff check found issues"

    ruff-format:
      glob: *python_files
      run: uv run ruff format --check {staged_files}
      fail_text: "ruff format check failed (run: uv run ruff format)"

pre-push:
  commands:
    pytest:
      run: uv run pytest
      fail_text: "pytest failed"
